# keyd: Caps Lock navigation layer, installed to /etc/keyd/default.conf by keyd_setup.sh.
# Same layer on macOS: .config/karabiner/assets/complex_modifications/nav-layer.json
#   tap Caps        Esc
#   hold Caps + hjkl   arrows
#   hold Caps + u/d    Page Up / Page Down
#   hold Caps + a/e    Home / End (also 0 / 4 like vim's 0 / $)

[ids]
*

[main]
capslock = overload(nav, esc)

[nav]
h = left
j = down
k = up
l = right
u = pageup
d = pagedown
a = home
e = end
0 = home
4 = end
