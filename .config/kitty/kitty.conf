# ~/.config/kitty/kitty.conf
# Only the settings that differ from kitty's defaults.
# All options: https://sw.kovidgoyal.net/kitty/conf/

## Font
font_family CaskaydiaCove Nerd Font Mono
font_size   13.0

## Scrolling
wheel_scroll_multiplier 10.0
wheel_scroll_min_lines  3
touch_scroll_multiplier 10.0

## Window
remember_window_size  no
initial_window_width  88c
initial_window_height 40c

## Shell
# Use zsh even where the login shell can't be changed (directory accounts).
# /bin/zsh exists on both macOS and Ubuntu.
shell /bin/zsh

## macOS
macos_quit_when_last_window_closed yes
macos_option_as_alt yes

# Cmd+Left/Right: jump a word back/forward
map cmd+left  send_text all \x1b\x62
map cmd+right send_text all \x1b\x66
